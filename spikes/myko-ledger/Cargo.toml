# Throwaway proof for RAL-39. Not production code, and not part of Rally's build:
# the empty [workspace] keeps it out of any parent workspace.
[package]
name = "myko-ledger-spike"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
myko = "=6.9.0"
myko-server = "=6.9.0"
myko-macros = "=6.9.0"
hex = "0.4.3"
libc = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"
