[package]
name = "rally"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A ledger of progress for a muster of agents."
repository = "https://github.com/Castor-o7/rally"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
