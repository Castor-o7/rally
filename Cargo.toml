[package]
name = "rally"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "A ledger of progress for a muster of agents."
repository = "https://github.com/Castor-o7/rally"
publish = false

[dependencies]
axum = "0.8.9"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
hex = "0.4.3"
hyper-util = { version = "0.1.21", features = ["tokio"] }
myko = "=6.9.0"
myko-macros = "=6.9.0"
myko-server = "=6.9.0"
postgres = "0.19.14"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
uuid = "1.29.0"

[dev-dependencies]
tempfile = "3.27.0"
