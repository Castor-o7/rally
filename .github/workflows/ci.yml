name: CI

# CI runs on Murph now (RAL-144): ci-local runs these jobs from .ci/local.toml and posts
# `local/check` and `local/dependency-audit`. This workflow stays only to be run by hand.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The ledger's tests need Postgres, and fail rather than skip without it.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          # Not 5432: the tests refuse it, so they can never meet a Postgres someone is using.
          - 54329:5432
        # The same path inside and out, so the disk-floor check can find Postgres's data.
        volumes:
          - /var/lib/postgresql/data:/var/lib/postgresql/data
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      RALLY_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:54329/postgres
      # The viewer's sign-in is driven through the runner's own Chrome (RAL-84), and can't be
      # skipped here. --no-sandbox because Ubuntu's AppArmor stops Chrome's sandbox on the runner;
      # it only ever opens the test's own loopback viewer.
      RALLY_TEST_CHROME: google-chrome --no-sandbox
      RALLY_TEST_BROWSER_REQUIRED: "1"
      # The socket test must read lsof here, not only /proc (RAL-107).
      RALLY_TEST_LSOF_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The browser test's script needs Node 22's global WebSocket; the runner's default is older.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chrome is there
        run: google-chrome --version
      # Tests that stop Postgres start a scratch cluster of their own with initdb and pg_ctl, and
      # the socket test reads lsof.
      - name: Postgres binaries and lsof
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql
          fi
          command -v lsof >/dev/null || sudo apt-get install -y lsof
          bin="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)"
          test -x "$bin/initdb" && test -x "$bin/pg_ctl"
          echo "RALLY_TEST_PG_BIN=$bin" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Dependency audit (RAL-60): advisories, licences, bans and sources, as configured in deny.toml,
  # where every ignored advisory says why. cargo-deny is built from crates.io at a pinned version,
  # as Muster's MUS-11 does, so no third-party action runs.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny check
